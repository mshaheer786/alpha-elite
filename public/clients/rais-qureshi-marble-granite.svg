<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <style>
    .rq-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 18px; font-weight: 800; fill: #111111; letter-spacing: 1.5px; }
    .rq-sub { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 8px; font-weight: 600; fill: #555555; letter-spacing: 2px; }
    .stone { fill: #1F2937; }
    .accent { fill: #C8282D; }
  </style>
  <g transform="translate(10, 12)">
    <!-- Geometric Marble Diamond -->
    <polygon points="14,2 26,14 14,26 2,14" class="stone" />
    <polygon points="14,6 22,14 14,22 6,14" class="accent" opacity="0.85" />
    <!-- Text -->
    <text x="36" y="16" class="rq-title">RQ MARBLE</text>
    <text x="37" y="27" class="rq-sub">&amp; GRANITE CO.</text>
  </g>
</svg>
