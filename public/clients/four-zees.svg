<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <style>
    .fz-text { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 19px; font-weight: 900; fill: #0F172A; letter-spacing: 1px; }
    .fz-badge { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 8.5px; font-weight: 700; fill: #C8282D; letter-spacing: 2.5px; }
  </style>
  <g transform="translate(10, 11)">
